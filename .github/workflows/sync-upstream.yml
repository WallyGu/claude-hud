name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'jarrodwatts/claude-hud'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jarrodwatts/claude-hud.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"; exit 0
          fi
          # A conflict fails the job, so local patches never get silently dropped.
          git merge upstream/main -m "Merge upstream main"
          git push origin HEAD:main

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # Pushes made with GITHUB_TOKEN don't trigger build-dist.yml, so rebuild dist/ here.
      - name: Rebuild dist
        run: |
          npm ci
          npm run build
          git add dist/ --force
          git diff --cached --quiet || (git commit -m "build: compile dist/ [auto]" && git push origin HEAD:main)
