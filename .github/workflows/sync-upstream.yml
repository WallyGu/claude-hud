name: Sync fork with upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'jarrodwatts/claude-hud'
    steps:
      - name: Sync main with jarrodwatts/claude-hud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --source jarrodwatts/claude-hud --branch main
